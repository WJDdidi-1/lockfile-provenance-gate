name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test

  package:
    name: pack and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pack the tarball
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "PACK_DIR=$workdir" >> "$GITHUB_ENV"
          npm pack --pack-destination "$workdir" >/dev/null
      - name: install the tarball in a clean directory and run both binaries
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install "$PACK_DIR"/lockfile-provenance-gate-*.tgz --ignore-scripts --no-audit --no-fund >/dev/null
          for bin in lockfile-provenance-gate provenance-gate; do
            test "$(./node_modules/.bin/$bin --version)" = "$version"
            ./node_modules/.bin/$bin --help | grep -q -- '--offline'
          done
